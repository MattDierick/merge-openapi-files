openapi: 3.0.3
info:
  title: Orders API
  version: 1.0.0
  description: API for managing orders
tags:
  - name: orders-api_Orders
    description: Order management operations
    x-displayName: Orders
  - name: orders-api_Order Items
    description: Line-item operations within an order
    x-displayName: Order Items
  - name: payments-api_Payments
    description: Payment processing operations
    x-displayName: Payments
  - name: payments-api_Refunds
    description: Refund operations on existing payments
    x-displayName: Refunds
  - name: payments-api_Payment Methods
    description: Stored payment method management
    x-displayName: Payment Methods
  - name: users-api_Users
    description: User management operations
    x-displayName: Users
paths:
  /orders:
    servers: []
    get:
      tags:
        - orders-api_Orders
      summary: List all orders
      operationId: listOrders
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Orders_API_OrderStatus'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A paginated list of orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders_API_OrderList'
        '500':
          $ref: '#/components/responses/Orders_API_InternalServerError'
    post:
      tags:
        - orders-api_Orders
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Orders_API_CreateOrderRequest'
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders_API_Order'
        '400':
          $ref: '#/components/responses/Orders_API_BadRequest'
        '500':
          $ref: '#/components/responses/Orders_API_InternalServerError'
  /orders/{orderId}:
    servers: []
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - orders-api_Orders
      summary: Get an order by ID
      operationId: getOrderById
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders_API_Order'
        '404':
          $ref: '#/components/responses/Orders_API_NotFound'
        '500':
          $ref: '#/components/responses/Orders_API_InternalServerError'
    patch:
      tags:
        - orders-api_Orders
      summary: Update order status
      operationId: updateOrderStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Orders_API_UpdateOrderStatusRequest'
      responses:
        '200':
          description: Order status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders_API_Order'
        '400':
          $ref: '#/components/responses/Orders_API_BadRequest'
        '404':
          $ref: '#/components/responses/Orders_API_NotFound'
        '500':
          $ref: '#/components/responses/Orders_API_InternalServerError'
    delete:
      tags:
        - orders-api_Orders
      summary: Cancel an order
      operationId: cancelOrder
      responses:
        '204':
          description: Order cancelled successfully
        '404':
          $ref: '#/components/responses/Orders_API_NotFound'
        '500':
          $ref: '#/components/responses/Orders_API_InternalServerError'
  /orders/{orderId}/items:
    servers: []
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - orders-api_Order Items
      summary: List items in an order
      operationId: listOrderItems
      responses:
        '200':
          description: List of order items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Orders_API_OrderItem'
        '404':
          $ref: '#/components/responses/Orders_API_NotFound'
        '500':
          $ref: '#/components/responses/Orders_API_InternalServerError'
    post:
      tags:
        - orders-api_Order Items
      summary: Add an item to an order
      operationId: addOrderItem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Orders_API_AddOrderItemRequest'
      responses:
        '201':
          description: Item added to order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Orders_API_OrderItem'
        '400':
          $ref: '#/components/responses/Orders_API_BadRequest'
        '404':
          $ref: '#/components/responses/Orders_API_NotFound'
        '500':
          $ref: '#/components/responses/Orders_API_InternalServerError'
  /payments:
    servers: []
    get:
      tags:
        - payments-api_Payments
      summary: List all payments
      operationId: listPayments
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Payments_API_PaymentStatus'
        - name: orderId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A paginated list of payments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments_API_PaymentList'
        '500':
          $ref: '#/components/responses/Payments_API_InternalServerError'
    post:
      tags:
        - payments-api_Payments
      summary: Initiate a new payment
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payments_API_CreatePaymentRequest'
      responses:
        '201':
          description: Payment initiated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments_API_Payment'
        '400':
          $ref: '#/components/responses/Payments_API_BadRequest'
        '422':
          $ref: '#/components/responses/Payments_API_UnprocessableEntity'
        '500':
          $ref: '#/components/responses/Payments_API_InternalServerError'
  /payments/{paymentId}:
    servers: []
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - payments-api_Payments
      summary: Get a payment by ID
      operationId: getPaymentById
      responses:
        '200':
          description: Payment found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments_API_Payment'
        '404':
          $ref: '#/components/responses/Payments_API_NotFound'
        '500':
          $ref: '#/components/responses/Payments_API_InternalServerError'
    delete:
      tags:
        - payments-api_Payments
      summary: Cancel a pending payment
      operationId: cancelPayment
      responses:
        '204':
          description: Payment cancelled successfully
        '404':
          $ref: '#/components/responses/Payments_API_NotFound'
        '409':
          $ref: '#/components/responses/Payments_API_Conflict'
        '500':
          $ref: '#/components/responses/Payments_API_InternalServerError'
  /payments/{paymentId}/capture:
    servers: []
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags:
        - payments-api_Payments
      summary: Capture an authorised payment
      operationId: capturePayment
      responses:
        '200':
          description: Payment captured successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments_API_Payment'
        '404':
          $ref: '#/components/responses/Payments_API_NotFound'
        '409':
          $ref: '#/components/responses/Payments_API_Conflict'
        '500':
          $ref: '#/components/responses/Payments_API_InternalServerError'
  /payments/{paymentId}/refunds:
    servers: []
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags:
        - payments-api_Refunds
      summary: List refunds for a payment
      operationId: listRefunds
      responses:
        '200':
          description: List of refunds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payments_API_Refund'
        '404':
          $ref: '#/components/responses/Payments_API_NotFound'
        '500':
          $ref: '#/components/responses/Payments_API_InternalServerError'
    post:
      tags:
        - payments-api_Refunds
      summary: Issue a refund for a payment
      operationId: createRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payments_API_CreateRefundRequest'
      responses:
        '201':
          description: Refund issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments_API_Refund'
        '400':
          $ref: '#/components/responses/Payments_API_BadRequest'
        '404':
          $ref: '#/components/responses/Payments_API_NotFound'
        '409':
          $ref: '#/components/responses/Payments_API_Conflict'
        '500':
          $ref: '#/components/responses/Payments_API_InternalServerError'
  /payment-methods:
    servers: []
    get:
      tags:
        - payments-api_Payment Methods
      summary: List saved payment methods for a customer
      operationId: listPaymentMethods
      parameters:
        - name: customerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payments_API_PaymentMethod'
        '500':
          $ref: '#/components/responses/Payments_API_InternalServerError'
    post:
      tags:
        - payments-api_Payment Methods
      summary: Save a new payment method
      operationId: createPaymentMethod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Payments_API_CreatePaymentMethodRequest'
      responses:
        '201':
          description: Payment method saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payments_API_PaymentMethod'
        '400':
          $ref: '#/components/responses/Payments_API_BadRequest'
        '500':
          $ref: '#/components/responses/Payments_API_InternalServerError'
  /payment-methods/{methodId}:
    servers: []
    parameters:
      - name: methodId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags:
        - payments-api_Payment Methods
      summary: Delete a saved payment method
      operationId: deletePaymentMethod
      responses:
        '204':
          description: Payment method deleted successfully
        '404':
          $ref: '#/components/responses/Payments_API_NotFound'
        '500':
          $ref: '#/components/responses/Payments_API_InternalServerError'
  /users:
    servers: []
    get:
      tags:
        - users-api_Users
      summary: List all users
      operationId: listUsers
      parameters:
        - name: limit
          in: query
          description: Maximum number of users to return
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          description: Number of users to skip
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: A paginated list of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users_API_UserList'
        '500':
          $ref: '#/components/responses/Users_API_InternalServerError'
    post:
      tags:
        - users-api_Users
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Users_API_CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users_API_User'
        '400':
          $ref: '#/components/responses/Users_API_BadRequest'
        '500':
          $ref: '#/components/responses/Users_API_InternalServerError'
  /users/{userId}:
    servers: []
    parameters:
      - name: userId
        in: path
        required: true
        description: Unique identifier of the user
        schema:
          type: string
          format: uuid
    get:
      tags:
        - users-api_Users
      summary: Get a user by ID
      operationId: getUserById
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users_API_User'
        '404':
          $ref: '#/components/responses/Users_API_NotFound'
        '500':
          $ref: '#/components/responses/Users_API_InternalServerError'
    put:
      tags:
        - users-api_Users
      summary: Update a user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Users_API_UpdateUserRequest'
      responses:
        '200':
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Users_API_User'
        '400':
          $ref: '#/components/responses/Users_API_BadRequest'
        '404':
          $ref: '#/components/responses/Users_API_NotFound'
        '500':
          $ref: '#/components/responses/Users_API_InternalServerError'
    delete:
      tags:
        - users-api_Users
      summary: Delete a user
      operationId: deleteUser
      responses:
        '204':
          description: User deleted successfully
        '404':
          $ref: '#/components/responses/Users_API_NotFound'
        '500':
          $ref: '#/components/responses/Users_API_InternalServerError'
components:
  schemas:
    Orders_API_OrderStatus:
      type: string
      enum:
        - pending
        - confirmed
        - shipped
        - delivered
        - cancelled
      example: pending
    Orders_API_Order:
      type: object
      required:
        - id
        - userId
        - status
        - items
        - totalAmount
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        userId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        status:
          $ref: '#/components/schemas/Orders_API_OrderStatus'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Orders_API_OrderItem'
        totalAmount:
          type: number
          format: float
          example: 149.99
        createdAt:
          type: string
          format: date-time
          example: '2024-03-01T09:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-03-02T11:30:00Z'
    Orders_API_OrderItem:
      type: object
      required:
        - id
        - productId
        - quantity
        - unitPrice
      properties:
        id:
          type: string
          format: uuid
          example: c3d4e5f6-a7b8-9012-cdef-123456789012
        productId:
          type: string
          format: uuid
          example: d4e5f6a7-b8c9-0123-defa-234567890123
        quantity:
          type: integer
          minimum: 1
          example: 2
        unitPrice:
          type: number
          format: float
          example: 74.99
    Orders_API_OrderList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Orders_API_Order'
        total:
          type: integer
          example: 15
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    Orders_API_CreateOrderRequest:
      type: object
      required:
        - userId
        - items
      properties:
        userId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Orders_API_AddOrderItemRequest'
    Orders_API_AddOrderItemRequest:
      type: object
      required:
        - productId
        - quantity
        - unitPrice
      properties:
        productId:
          type: string
          format: uuid
          example: d4e5f6a7-b8c9-0123-defa-234567890123
        quantity:
          type: integer
          minimum: 1
          example: 2
        unitPrice:
          type: number
          format: float
          example: 74.99
    Orders_API_UpdateOrderStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/Orders_API_OrderStatus'
    Orders_API_Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: The requested resource was not found
    Payments_API_PaymentStatus:
      type: string
      enum:
        - pending
        - authorised
        - captured
        - cancelled
        - failed
        - refunded
      example: pending
    Payments_API_Payment:
      type: object
      required:
        - id
        - orderId
        - amount
        - currency
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: g7h8i9j0-k1l2-3456-mnop-789012345678
        orderId:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        amount:
          type: number
          format: float
          example: 149.99
        currency:
          type: string
          example: EUR
        status:
          $ref: '#/components/schemas/Payments_API_PaymentStatus'
        paymentMethodId:
          type: string
          format: uuid
          example: h8i9j0k1-l2m3-4567-nopq-890123456789
        createdAt:
          type: string
          format: date-time
          example: '2024-04-01T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-04-01T10:05:00Z'
    Payments_API_PaymentList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payments_API_Payment'
        total:
          type: integer
          example: 8
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    Payments_API_CreatePaymentRequest:
      type: object
      required:
        - orderId
        - amount
        - currency
      properties:
        orderId:
          type: string
          format: uuid
          example: b2c3d4e5-f6a7-8901-bcde-f12345678901
        amount:
          type: number
          format: float
          example: 149.99
        currency:
          type: string
          example: EUR
        paymentMethodId:
          type: string
          format: uuid
          example: h8i9j0k1-l2m3-4567-nopq-890123456789
    Payments_API_Refund:
      type: object
      required:
        - id
        - paymentId
        - amount
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: i9j0k1l2-m3n4-5678-opqr-901234567890
        paymentId:
          type: string
          format: uuid
          example: g7h8i9j0-k1l2-3456-mnop-789012345678
        amount:
          type: number
          format: float
          example: 49.99
        reason:
          type: string
          example: Customer requested cancellation
        status:
          type: string
          enum:
            - pending
            - succeeded
            - failed
          example: succeeded
        createdAt:
          type: string
          format: date-time
          example: '2024-04-03T09:00:00Z'
    Payments_API_CreateRefundRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
          format: float
          example: 49.99
        reason:
          type: string
          example: Customer requested cancellation
    Payments_API_PaymentMethod:
      type: object
      required:
        - id
        - customerId
        - type
        - last4
        - expiryMonth
        - expiryYear
      properties:
        id:
          type: string
          format: uuid
          example: h8i9j0k1-l2m3-4567-nopq-890123456789
        customerId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type:
          type: string
          enum:
            - card
            - bank_transfer
            - paypal
          example: card
        last4:
          type: string
          example: '4242'
        expiryMonth:
          type: integer
          example: 12
        expiryYear:
          type: integer
          example: 2027
    Payments_API_CreatePaymentMethodRequest:
      type: object
      required:
        - customerId
        - type
        - token
      properties:
        customerId:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        type:
          type: string
          enum:
            - card
            - bank_transfer
            - paypal
          example: card
        token:
          type: string
          description: Tokenised card or account data from the payment provider
          example: tok_visa_4242
    Payments_API_Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: The requested resource was not found
    Users_API_User:
      type: object
      required:
        - id
        - email
        - name
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
        email:
          type: string
          format: email
          example: jane.doe@example.com
        name:
          type: string
          example: Jane Doe
        createdAt:
          type: string
          format: date-time
          example: '2024-01-15T10:30:00Z'
        updatedAt:
          type: string
          format: date-time
          example: '2024-06-20T14:00:00Z'
    Users_API_UserList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Users_API_User'
        total:
          type: integer
          example: 42
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0
    Users_API_CreateUserRequest:
      type: object
      required:
        - email
        - name
      properties:
        email:
          type: string
          format: email
          example: jane.doe@example.com
        name:
          type: string
          example: Jane Doe
    Users_API_UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: jane.updated@example.com
        name:
          type: string
          example: Jane Updated
    Users_API_Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: NOT_FOUND
        message:
          type: string
          example: The requested resource was not found
  responses:
    Orders_API_BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Orders_API_Error'
    Orders_API_NotFound:
      description: Resource not found
      content:
        application/json:
