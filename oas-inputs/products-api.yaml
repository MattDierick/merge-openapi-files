openapi: 3.0.3
info:
  title: Products API
  version: 1.0.1
  description: API for managing products and categories

tags:
  - name: Products
    description: Product catalog operations
  - name: Categories
    description: Product category operations

paths:
  /products:
    get:
      tags: [Products]
      summary: List all products
      operationId: listProducts
      parameters:
        - name: categoryId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: inStock
          in: query
          required: false
          schema:
            type: boolean
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A paginated list of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Products]
      summary: Create a new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /products/{productId}:
    parameters:
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Products]
      summary: Get a product by ID
      operationId: getProductById
      responses:
        "200":
          description: Product found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Products]
      summary: Update a product
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Products]
      summary: Delete a product
      operationId: deleteProduct
      responses:
        "204":
          description: Product deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /categories:
    get:
      tags: [Categories]
      summary: List all categories
      operationId: listCategories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Categories]
      summary: Create a new category
      operationId: createCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCategoryRequest"
      responses:
        "201":
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Categories]
      summary: Get a category by ID
      operationId: getCategoryById
      responses:
        "200":
          description: Category found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Categories]
      summary: Delete a category
      operationId: deleteCategory
      responses:
        "204":
          description: Category deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Product:
      type: object
      required: [id, name, price, stock, categoryId, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: "e5f6a7b8-c9d0-1234-efab-567890123456"
        name:
          type: string
          example: "Wireless Headphones"
        description:
          type: string
          example: "Premium noise-cancelling wireless headphones"
        price:
          type: number
          format: float
          example: 199.99
        stock:
          type: integer
          minimum: 0
          example: 42
        categoryId:
          type: string
          format: uuid
          example: "f6a7b8c9-d0e1-2345-fabc-678901234567"
        createdAt:
          type: string
          format: date-time
          example: "2024-02-10T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-05-01T12:00:00Z"

    ProductList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
          example: 120
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    CreateProductRequest:
      type: object
      required: [name, price, stock, categoryId]
      properties:
        name:
          type: string
          example: "Wireless Headphones"
        description:
          type: string
          example: "Premium noise-cancelling wireless headphones"
        price:
          type: number
          format: float
          example: 199.99
        stock:
          type: integer
          minimum: 0
          example: 42
        categoryId:
          type: string
          format: uuid
          example: "f6a7b8c9-d0e1-2345-fabc-678901234567"

    UpdateProductRequest:
      type: object
      properties:
        name:
          type: string
          example: "Wireless Headphones Pro"
        description:
          type: string
          example: "Updated description"
        price:
          type: number
          format: float
          example: 249.99
        stock:
          type: integer
          minimum: 0
          example: 30

    Category:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          example: "f6a7b8c9-d0e1-2345-fabc-678901234567"
        name:
          type: string
          example: "Electronics"
        description:
          type: string
          example: "Electronic devices and accessories"

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "Electronics"
        description:
          type: string
          example: "Electronic devices and accessories"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "The requested resource was not found"

  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
