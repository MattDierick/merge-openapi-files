openapi: 3.0.3
info:
  title: Products API
  version: 1.0.0
  description: API for managing products

tags:
  - name: Products
    description: Product management operations

paths:
  /products:
    get:
      tags:
        - Products
      summary: List all products
      operationId: listProducts
      parameters:
        - name: limit
          in: query
          description: Maximum number of products to return
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          description: Number of products to skip
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A paginated list of products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductList"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    Product:
      type: object
      required:
        - id
        - name
        - price
        - createdAt
      properties:
        id:
          type: string
          format: uuid
          example: "f1e2d3c4-b5a6-7890-fedc-ba9876543210"
        name:
          type: string
          example: "Wireless Headphones"
        description:
          type: string
          example: "High-quality noise-cancelling wireless headphones"
        price:
          type: number
          format: float
          example: 199.99
        createdAt:
          type: string
          format: date-time
          example: "2024-05-10T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-07-15T12:00:00Z"

    ProductList:
      type: object
      required:
        - items
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
          example: 100
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "INTERNAL_SERVER_ERROR"
        message:
          type: string
          example: "An unexpected error occurred"

  responses:
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
