openapi: 3.0.3
info:
  title: Events API
  version: 1.0.0
  description: API for managing events and attendees

tags:
  - name: Events
    description: Event management operations
  - name: Attendees
    description: Attendee registration operations

paths:
  /events:
    get:
      tags: [Events]
      summary: List all events
      operationId: listEvents
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/EventStatus"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A paginated list of events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventList"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Events]
      summary: Create a new event
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEventRequest"
      responses:
        "201":
          description: Event created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /events/{eventId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Events]
      summary: Get an event by ID
      operationId: getEventById
      responses:
        "200":
          description: Event found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags: [Events]
      summary: Update an event
      operationId: updateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEventRequest"
      responses:
        "200":
          description: Event updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Events]
      summary: Cancel an event
      operationId: cancelEvent
      responses:
        "204":
          description: Event cancelled successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /events/{eventId}/attendees:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Attendees]
      summary: List attendees for an event
      operationId: listAttendees
      responses:
        "200":
          description: List of attendees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attendee"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Attendees]
      summary: Register an attendee to an event
      operationId: registerAttendee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterAttendeeRequest"
      responses:
        "201":
          description: Attendee registered successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /events/{eventId}/attendees/{attendeeId}:
    parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attendeeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Attendees]
      summary: Get an attendee registration
      operationId: getAttendee
      responses:
        "200":
          description: Attendee found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attendee"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Attendees]
      summary: Cancel an attendee registration
      operationId: cancelAttendeeRegistration
      responses:
        "204":
          description: Registration cancelled successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    EventStatus:
      type: string
      enum: [draft, published, cancelled, completed]
      example: "published"

    Event:
      type: object
      required: [id, title, status, startDate, endDate, location, capacity, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        title:
          type: string
          example: "API Summit 2024"
        description:
          type: string
          example: "Annual conference for API practitioners"
        status:
          $ref: "#/components/schemas/EventStatus"
        startDate:
          type: string
          format: date-time
          example: "2024-09-15T09:00:00Z"
        endDate:
          type: string
          format: date-time
          example: "2024-09-15T18:00:00Z"
        location:
          type: string
          example: "Brussels Expo, Belgium"
        capacity:
          type: integer
          minimum: 1
          example: 500
        attendeeCount:
          type: integer
          example: 342
        createdAt:
          type: string
          format: date-time
          example: "2024-01-10T08:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-06-01T10:00:00Z"

    EventList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        total:
          type: integer
          example: 12
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    CreateEventRequest:
      type: object
      required: [title, startDate, endDate, location, capacity]
      properties:
        title:
          type: string
          example: "API Summit 2024"
        description:
          type: string
          example: "Annual conference for API practitioners"
        startDate:
          type: string
          format: date-time
          example: "2024-09-15T09:00:00Z"
        endDate:
          type: string
          format: date-time
          example: "2024-09-15T18:00:00Z"
        location:
          type: string
          example: "Brussels Expo, Belgium"
        capacity:
          type: integer
          minimum: 1
          example: 500

    UpdateEventRequest:
      type: object
      properties:
        title:
          type: string
          example: "API Summit 2024 — Updated"
        description:
          type: string
          example: "Updated description"
        startDate:
          type: string
          format: date-time
          example: "2024-09-16T09:00:00Z"
        endDate:
          type: string
          format: date-time
          example: "2024-09-16T18:00:00Z"
        location:
          type: string
          example: "Brussels Expo, Hall 5"
        capacity:
          type: integer
          minimum: 1
          example: 600
        status:
          $ref: "#/components/schemas/EventStatus"

    Attendee:
      type: object
      required: [id, eventId, userId, registeredAt]
      properties:
        id:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        eventId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        userId:
          type: string
          format: uuid
          example: "c3d4e5f6-a7b8-9012-cdef-123456789012"
        registeredAt:
          type: string
          format: date-time
          example: "2024-07-01T14:00:00Z"

    RegisterAttendeeRequest:
      type: object
      required: [userId]
      properties:
        userId:
          type: string
          format: uuid
          example: "c3d4e5f6-a7b8-9012-cdef-123456789012"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "The requested resource was not found"

  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Attendee already registered for this event
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
