openapi: 3.0.3
info:
  title: Payments API
  version: 1.0.0
  description: API for managing payments, refunds and payment methods

tags:
  - name: Payments
    description: Payment processing operations
  - name: Refunds
    description: Refund operations on existing payments
  - name: Payment Methods
    description: Stored payment method management

paths:
  /payments:
    get:
      tags: [Payments]
      summary: List all payments
      operationId: listPayments
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PaymentStatus"
        - name: orderId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: A paginated list of payments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Payments]
      summary: Initiate a new payment
      operationId: createPayment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment initiated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /payments/{paymentId}:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Payments]
      summary: Get a payment by ID
      operationId: getPaymentById
      responses:
        "200":
          description: Payment found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags: [Payments]
      summary: Cancel a pending payment
      operationId: cancelPayment
      responses:
        "204":
          description: Payment cancelled successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /payments/{paymentId}/capture:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [Payments]
      summary: Capture an authorised payment
      operationId: capturePayment
      responses:
        "200":
          description: Payment captured successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /payments/{paymentId}/refunds:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Refunds]
      summary: List refunds for a payment
      operationId: listRefunds
      responses:
        "200":
          description: List of refunds
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Refund"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Refunds]
      summary: Issue a refund for a payment
      operationId: createRefund
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Refund issued successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /payment-methods:
    get:
      tags: [Payment Methods]
      summary: List saved payment methods for a customer
      operationId: listPaymentMethods
      parameters:
        - name: customerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of payment methods
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentMethod"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [Payment Methods]
      summary: Save a new payment method
      operationId: createPaymentMethod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentMethodRequest"
      responses:
        "201":
          description: Payment method saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentMethod"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /payment-methods/{methodId}:
    parameters:
      - name: methodId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [Payment Methods]
      summary: Delete a saved payment method
      operationId: deletePaymentMethod
      responses:
        "204":
          description: Payment method deleted successfully
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    PaymentStatus:
      type: string
      enum: [pending, authorised, captured, cancelled, failed, refunded]
      example: "pending"

    Payment:
      type: object
      required: [id, orderId, amount, currency, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: "g7h8i9j0-k1l2-3456-mnop-789012345678"
        orderId:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        amount:
          type: number
          format: float
          example: 149.99
        currency:
          type: string
          example: "EUR"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        paymentMethodId:
          type: string
          format: uuid
          example: "h8i9j0k1-l2m3-4567-nopq-890123456789"
        createdAt:
          type: string
          format: date-time
          example: "2024-04-01T10:00:00Z"
        updatedAt:
          type: string
          format: date-time
          example: "2024-04-01T10:05:00Z"

    PaymentList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        total:
          type: integer
          example: 8
        limit:
          type: integer
          example: 20
        offset:
          type: integer
          example: 0

    CreatePaymentRequest:
      type: object
      required: [orderId, amount, currency]
      properties:
        orderId:
          type: string
          format: uuid
          example: "b2c3d4e5-f6a7-8901-bcde-f12345678901"
        amount:
          type: number
          format: float
          example: 149.99
        currency:
          type: string
          example: "EUR"
        paymentMethodId:
          type: string
          format: uuid
          example: "h8i9j0k1-l2m3-4567-nopq-890123456789"

    Refund:
      type: object
      required: [id, paymentId, amount, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: "i9j0k1l2-m3n4-5678-opqr-901234567890"
        paymentId:
          type: string
          format: uuid
          example: "g7h8i9j0-k1l2-3456-mnop-789012345678"
        amount:
          type: number
          format: float
          example: 49.99
        reason:
          type: string
          example: "Customer requested cancellation"
        status:
          type: string
          enum: [pending, succeeded, failed]
          example: "succeeded"
        createdAt:
          type: string
          format: date-time
          example: "2024-04-03T09:00:00Z"

    CreateRefundRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          format: float
          example: 49.99
        reason:
          type: string
          example: "Customer requested cancellation"

    PaymentMethod:
      type: object
      required: [id, customerId, type, last4, expiryMonth, expiryYear]
      properties:
        id:
          type: string
          format: uuid
          example: "h8i9j0k1-l2m3-4567-nopq-890123456789"
        customerId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        type:
          type: string
          enum: [card, bank_transfer, paypal]
          example: "card"
        last4:
          type: string
          example: "4242"
        expiryMonth:
          type: integer
          example: 12
        expiryYear:
          type: integer
          example: 2027

    CreatePaymentMethodRequest:
      type: object
      required: [customerId, type, token]
      properties:
        customerId:
          type: string
          format: uuid
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
        type:
          type: string
          enum: [card, bank_transfer, paypal]
          example: "card"
        token:
          type: string
          description: Tokenised card or account data from the payment provider
          example: "tok_visa_4242"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "The requested resource was not found"

  responses:
    BadRequest:
      description: Invalid request payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: Request conflicts with the current state of the resource
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: Payment could not be processed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalServerError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
